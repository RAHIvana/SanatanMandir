# Builds the website and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Build and deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 9 * * *" # daily 9:15 UTC (4:15 am Central) so events that have passed move to "Past events"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
